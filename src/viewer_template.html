<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLM Lobby 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen tool — slim header, full-bleed 3D stage, controls floating on the stage */
  --bg:#ecebe8; --stage:#dcdbd7; --panel:#f7f6f3; --ink:#232325; --muted:#6b6a68;
  --line:#c9c7c1; --accent:#8c6c50; --accent-ink:#ffffff; --dim:#d2372b;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1b1d; --stage:#2a2a2d; --panel:#242427; --ink:#ecebe8; --muted:#a09e99;
    --line:#3c3c40; --accent:#b08a68; --accent-ink:#1b1b1d; --dim:#ff6a5c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1b1d; --stage:#2a2a2d; --panel:#242427; --ink:#ecebe8; --muted:#a09e99;
  --line:#3c3c40; --accent:#b08a68; --accent-ink:#1b1b1d; --dim:#ff6a5c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#oldv,.dl{color:var(--accent)}
#ver{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.02em;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:500}
main{position:relative;flex:1;min-height:0;background:var(--stage)}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.bar{position:absolute;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.bar>*{pointer-events:auto}
.views{bottom:16px}
.layers{top:12px;justify-content:flex-end}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,#stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{position:absolute;left:16px;top:14px;color:var(--muted);font-size:12px;max-width:46%;pointer-events:none}
.dimlab{position:absolute;transform:translate(-50%,-50%);color:var(--dim);font-weight:600;font-size:13px;
  background:var(--panel);padding:1px 6px;border-radius:4px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.room{position:absolute;transform:translate(-50%,-50%);font:inherit;font-size:12px;font-weight:500;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;text-align:center;cursor:text}
.room:hover{border-color:var(--accent)}
.room:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.el{position:absolute;width:9px;height:9px;margin:-5px 0 0 -5px;border-radius:50%;border:1px solid rgba(0,0,0,.65);pointer-events:auto}
.el.sq{border-radius:1px}
.pal{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.pal input{width:110px;accent-color:var(--accent)}
#pal-name{min-width:9.5em;color:var(--muted)}
.legend{position:absolute;right:16px;top:52px;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:6px;font-size:12px}
.legend button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 6px;font-size:12px;text-align:left;color:var(--ink)}
.legend button[aria-pressed="false"]{background:none;color:var(--muted);text-decoration:line-through}
.legend button[aria-pressed="false"] i{opacity:.25}
.legend button[aria-pressed="true"]{background:none;color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.65);flex:none}
@media (max-width:560px){.legend{top:auto;bottom:110px;right:16px}}
#err{position:absolute;inset:auto 16px 64px 16px;background:var(--panel);border:1px solid var(--dim);color:var(--ink);
  padding:10px 12px;border-radius:6px;display:none}
@media (max-width:560px){.hint{display:none}.layers{justify-content:flex-start}}
</style>
</head>
<body>
<header>
  <h1>BLM Lobby <span id="ver"></span></h1>
  <div class="meta"><a href="v6/BLM_Lobby_plans_A3_1-50.pdf" class="dl">plans PDF</a> · <a href="v6/BLM_Lobby_plan_F1.dxf" class="dl">DXF floor 1</a> · <a href="v6/BLM_Lobby_plan_F2.dxf" class="dl">DXF floor 2</a> · <a href="v6/BLM_Lobby_v6.dae" class="dl">SketchUp DAE</a> · <a href="v5/" class="dl">v5</a> · <a href="v4/" class="dl">v4</a> · <a href="v3/" class="dl">v3</a> · Footprint <b id="sz"></b> · height <b id="hz"></b> · plan follows the 1:50 drawing, heights and stair rise are assumed</div>
</header>
<main>
  <div id="stage" tabindex="0" aria-label="3D model of the lobby. Arrow keys rotate the view, plus and minus zoom."></div>
  <div class="hint">Drag to rotate. Scroll or pinch to zoom. Shift or right button to pan. Click a label to rename it.</div>
  <div class="bar layers">
    <label class="pal" for="pal">Palette <input type="range" id="pal" min="0" max="0" step="1" value="0"> <span id="pal-name"></span></label>
    <button type="button" id="f-1" aria-pressed="true">Floor 1 · Lobby</button>
    <button type="button" id="f-2" aria-pressed="false">Floor 2 · Spa</button>
    <button type="button" id="t-rooms" aria-pressed="true">Room names</button>
    <button type="button" id="t-dims" aria-pressed="false">Dimensions</button>
    <button type="button" id="t-elec" aria-pressed="true">Electrical</button>
    <button type="button" id="t-ceil" aria-pressed="false">Ceiling and beams</button>
    <button type="button" id="t-zones" aria-pressed="false">Zones</button>
    <button type="button" id="t-furn" aria-pressed="true">Equipment</button>
    <button type="button" id="t-edge" aria-pressed="true">Outlines</button>
  </div>
  <div id="dims"></div>
  <div id="elec"></div>
  <div id="rooms"></div>
  <div class="legend" id="legend"></div>
  <div class="bar views" id="views"></div>
  <div id="err" role="alert"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var errBox=document.getElementById('err');
function fail(msg){errBox.textContent=msg;errBox.style.display='block';}
window.addEventListener('error',function(e){fail('3D viewer error: '+(e.message||e));});
if(!window.THREE){fail('The 3D library did not load. Reload the page or check your connection.');return;}

var M=/*MODEL*/null;
document.getElementById('sz').textContent=(M.size.L/1000).toFixed(1)+' × '+(M.size.W/1000).toFixed(1)+' m';
document.getElementById('ver').textContent=M.version||'';
document.getElementById('hz').textContent=(M.size.H/1000).toFixed(1)+' m';

var stage=document.getElementById('stage');
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(60,1,50,120000);
camera.up.set(0,0,1);
scene.add(new THREE.AmbientLight(0xffffff,0.62));
var l1=new THREE.DirectionalLight(0xffffff,0.5);l1.position.set(0.4,-0.5,0.75);scene.add(l1);
var l2=new THREE.DirectionalLight(0xffffff,0.22);l2.position.set(-0.6,0.5,0.3);scene.add(l2);

// ---- geometry: one group per tag (opaque mesh, glass mesh, edge lines) ----
var groups={},edgeLines=[];
var buf={},palTargets=[];
M.prims.forEach(function(p){
  var b=buf[p.tag]||(buf[p.tag]={pos:[],col:[],mats:[],gpos:[],edge:[]});
  var c=M.mats[p.mat],glass=c[3]<1;
  p.faces.forEach(function(f){
    for(var i=1;i<f.length-1;i++){
      [f[0],f[i],f[i+1]].forEach(function(v){
        if(glass){b.gpos.push(v[0],v[1],v[2]);}
        else{b.pos.push(v[0],v[1],v[2]);b.col.push(c[0]/255,c[1]/255,c[2]/255);b.mats.push(p.mat);}
      });
    }
    for(var j=0;j<f.length;j++){var a=f[j],d=f[(j+1)%f.length];b.edge.push(a[0],a[1],a[2],d[0],d[1],d[2]);}
  });
});
var matOpaque=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
var matGlass=new THREE.MeshBasicMaterial({color:0xa9c8d6,transparent:true,opacity:0.28,side:THREE.DoubleSide,depthWrite:false});
var matEdge=new THREE.LineBasicMaterial({color:0x0e0e10,transparent:true,opacity:0.5});
Object.keys(buf).forEach(function(tag){
  var b=buf[tag],g=new THREE.Group();
  if(b.pos.length){
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(b.pos,3));
    geo.setAttribute('color',new THREE.Float32BufferAttribute(b.col,3));
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo,matOpaque));palTargets.push({attr:geo.getAttribute('color'),mats:b.mats});
  }
  if(b.gpos.length){
    var gg=new THREE.BufferGeometry();
    gg.setAttribute('position',new THREE.Float32BufferAttribute(b.gpos,3));
    var gm=new THREE.Mesh(gg,matGlass);gm.renderOrder=2;g.add(gm);
  }
  var eg=new THREE.BufferGeometry();
  eg.setAttribute('position',new THREE.Float32BufferAttribute(b.edge,3));
  var ln=new THREE.LineSegments(eg,matEdge);edgeLines.push(ln);g.add(ln);
  groups[tag]=g;scene.add(g);
});

// ---- lettering on west-facing surfaces ----
var decor=groups.Decor||scene;
M.texts.forEach(function(t){
  var F=96,cv=document.createElement('canvas'),cx=cv.getContext('2d');
  var font='700 '+F+'px Arial, Helvetica, sans-serif';
  cx.font=font;var w=Math.ceil(cx.measureText(t.text).width)+8;
  cv.width=w;cv.height=Math.ceil(F*1.2);
  cx=cv.getContext('2d');cx.font=font;cx.fillStyle=t.c||'#141416';cx.textBaseline='alphabetic';cx.fillText(t.text,4,F*0.95);
  var em=t.h/0.72,W=w/F*em,Hh=1.2*em,z0=t.z-0.25*em,x=t.x-6;
  var geo=new THREE.BufferGeometry();
  var ys=t.y-6;
  geo.setAttribute('position',new THREE.Float32BufferAttribute(t.f==='s'?[t.x,ys,z0, t.x+W,ys,z0, t.x+W,ys,z0+Hh, t.x,ys,z0+Hh]:[x,t.y,z0, x,t.y-W,z0, x,t.y-W,z0+Hh, x,t.y,z0+Hh],3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,1,0,1,1,0,1],2));
  geo.setIndex([0,1,2,0,2,3]);
  var tex=new THREE.CanvasTexture(cv);
  var m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
  m.renderOrder=3;decor.add(m);
});

// ---- the 1400 mm mark ----
// ---- dimensions (button Dimensions): red lines with end ticks + labels in mm ----
var dimsOn=false,floor=1,dimGroups={1:new THREE.Group(),2:new THREE.Group()},dimEls=[],dimBox=document.getElementById('dims'),dimP=new THREE.Vector3();
(function(){
  var posF={1:[],2:[]};
  (M.dims||[]).forEach(function(d){var pos=posF[d.f||1];
    var a=d.a,b=d.b,dx=b[0]-a[0],dy=b[1]-a[1],Lh=Math.sqrt(dx*dx+dy*dy),tx=120,ty=0;
    if(Lh>1){tx=-dy/Lh*120;ty=dx/Lh*120;}
    pos.push(a[0],a[1],a[2],b[0],b[1],b[2]);
    [a,b].forEach(function(p){pos.push(p[0]-tx,p[1]-ty,p[2],p[0]+tx,p[1]+ty,p[2]);});
    var el=document.createElement('div');el.className='dimlab';el.textContent=d.t;dimBox.appendChild(el);dimEls.push([d,el]);
  });
  [1,2].forEach(function(f){
    var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(posF[f],3));
    var ln=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xd2372b,depthTest:false}));ln.renderOrder=5;
    dimGroups[f].add(ln);dimGroups[f].visible=false;scene.add(dimGroups[f]);
  });
})();
function placeDims(){
  var w=stage.clientWidth,h=stage.clientHeight;
  dimEls.forEach(function(p){
    var a=p[0].a,b=p[0].b;
    dimP.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2).project(camera);
    var show=dimsOn&&(p[0].f||1)===floor&&dimP.z<1&&dimP.z>-1&&Math.abs(dimP.x)<1&&Math.abs(dimP.y)<1;
    p[1].style.display=show?'block':'none';
    if(show){p[1].style.left=((dimP.x+1)/2*w)+'px';p[1].style.top=((1-dimP.y)/2*h)+'px';}
  });
}

// ---- room tags (rename by typing; names are remembered in this browser) ----
var roomsBox=document.getElementById('rooms'),roomEls=[],saved={},roomP=new THREE.Vector3(),roomsOn=true,zonesOn=false;
try{saved=JSON.parse(localStorage.getItem('blm-lobby-rooms')||'{}')||{};}catch(e){saved={};}
M.rooms.forEach(function(r){
  var el=document.createElement('input');el.type='text';el.className='room';el.id='room-'+r.id;
  el.setAttribute('aria-label','Room name');el.value=saved[r.id]||r.name;
  function fit(){el.size=Math.max(4,el.value.length+1);}
  fit();
  el.addEventListener('input',function(){fit();saved[r.id]=el.value;try{localStorage.setItem('blm-lobby-rooms',JSON.stringify(saved));}catch(e){}});
  el.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')el.blur();});
  roomsBox.appendChild(el);roomEls.push([r,el]);
});
function placeRooms(){
  var w=stage.clientWidth,h=stage.clientHeight;
  roomEls.forEach(function(p){
    roomP.set(p[0].x,p[0].y,p[0].z||60).project(camera);
    var show=(p[0].f||1)===floor&&(p[0].kind==='zone'?zonesOn:roomsOn)&&roomP.z<1&&roomP.z>-1&&Math.abs(roomP.x)<1&&Math.abs(roomP.y)<0.95;
    p[1].style.display=show?'block':'none';
    if(show){p[1].style.left=((roomP.x+1)/2*w)+'px';p[1].style.top=((1-roomP.y)/2*h)+'px';}
  });
}

// ---- electrical points from the power and lighting plans ----
var EL={lamp:['#f5cd28','Light'],socket:['#eb781e','Socket'],switch:['#286edc','Switch'],out:['#c832a0','Cable outlet'],fan:['#1ea0a0','Fan'],panel:['#be1e1e','Panel']};
var elShow={lamp:true,socket:false,switch:false,out:false,fan:false,panel:false};
function applyElec(){refresh();}
var elBox=document.getElementById('elec'),elEls=[],elOn=true,elP=new THREE.Vector3(),legend=document.getElementById('legend');
(M.elec||[]).forEach(function(e){
  var d=document.createElement('div');d.className='el'+(e.t==='panel'?' sq':'');d.style.background=EL[e.t][0];
  d.title=EL[e.t][1]+(e.t==='lamp'||e.t==='fan'?', ceiling':'');elBox.appendChild(d);elEls.push([e,d]);
});
Object.keys(EL).forEach(function(k){
  var n=(M.elec||[]).filter(function(e){return e.t===k;}).length;if(!n)return;
  var s=document.createElement('button'),i=document.createElement('i');i.style.background=EL[k][0];
  s.type='button';s.id='el-'+k;s.setAttribute('aria-pressed',elShow[k]?'true':'false');s.title='Show or hide this category';
  s.appendChild(i);s.appendChild(document.createTextNode(EL[k][1]+' · '+n));legend.appendChild(s);
  s.addEventListener('click',function(){elShow[k]=!elShow[k];s.setAttribute('aria-pressed',elShow[k]?'true':'false');applyElec();});
});
function placeElec(){
  var w=stage.clientWidth,h=stage.clientHeight;
  elEls.forEach(function(p){
    elP.set(p[0].x,p[0].y,p[0].z).project(camera);
    var show=elOn&&floor===1&&elShow[p[0].t]&&elP.z<1&&elP.z>-1&&Math.abs(elP.x)<1&&Math.abs(elP.y)<1;
    p[1].style.display=show?'block':'none';
    if(show){p[1].style.left=((elP.x+1)/2*w)+'px';p[1].style.top=((1-elP.y)/2*h)+'px';}
  });
}

// ---- orbit camera ----
var S={tx:0,ty:0,tz:0,r:1,th:0,ph:1},anim=null,dirty=true;
function fromPosTarget(p,t){var dx=p[0]-t[0],dy=p[1]-t[1],dz=p[2]-t[2],r=Math.sqrt(dx*dx+dy*dy+dz*dz);
  return {tx:t[0],ty:t[1],tz:t[2],r:r,th:Math.atan2(dy,dx),ph:Math.acos(dz/r)};}
function apply(){
  S.ph=Math.max(0.02,Math.min(Math.PI-0.02,S.ph));S.r=Math.max(300,Math.min(60000,S.r));
  var sp=Math.sin(S.ph);
  camera.position.set(S.tx+S.r*sp*Math.cos(S.th),S.ty+S.r*sp*Math.sin(S.th),S.tz+S.r*Math.cos(S.ph));
  camera.lookAt(S.tx,S.ty,S.tz);dirty=true;
}
var VIEWS=[
  ['Overview',[14500,-7000,9500],[6200,2700,600],1],
  ['Plan',[6120,2725,15500],[6120,2735,0],1],
  ['From the parking',[6585,-5000,1600],[7000,3000,1200],1],
  ['Entrance',[6600,2400,1650],[7200,300,1100],1],
  ['Reception and guard 2',[6585,250,1600],[7000,3200,1100],1],
  ['Waiting zone',[6700,2500,1650],[8900,1100,800],1],
  ['Armchair niche',[8000,2300,1650],[5300,900,900],1],
  ['Luggage room',[9900,3300,1700],[11600,5000,900],1],
  ['CCTV post',[9950,2450,1800],[12300,500,900],1],
  ['Barrier outside',[17500,-6500,5200],[12600,-300,600],1],
  ['Spa overview',[15500,-7500,14500],[6200,2700,3600],2],
  ['Spa plan',[6120,2725,19500],[6120,2735,3150],2],
  ['Spa corridor',[11800,2700,4850],[2000,2700,4300],2],
  ['Cabins',[3100,3100,5000],[3100,600,3700],2],
  ['Showers and WC',[3700,2500,5000],[3700,4800,3800],2],
  ['Waiting zone',[9300,2600,4900],[11500,4700,3900],2]
];
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i,instant){
  if(VIEWS[i][3]!==floor){floor=VIEWS[i][3];refresh();}
  var to=fromPosTarget(VIEWS[i][1],VIEWS[i][2]);
  viewBtns.forEach(function(b,k){b.setAttribute('aria-pressed',k===i?'true':'false');});
  if(instant||reduce){S=to;apply();return;}
  var from={tx:S.tx,ty:S.ty,tz:S.tz,r:S.r,th:S.th,ph:S.ph};
  var d=to.th-from.th;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;to.th=from.th+d;
  anim={from:from,to:to,t0:performance.now(),dur:500};
}
var vb=document.getElementById('views'),viewBtns=[];
VIEWS.forEach(function(v,i){var b=document.createElement('button');b.type='button';b.textContent=v[0];b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){go(i);});vb.appendChild(b);viewBtns.push(b);});
function clearView(){viewBtns.forEach(function(b){b.setAttribute('aria-pressed','false');});}

function pan(dx,dy){
  var k=S.r*0.0016;
  var rx=-Math.sin(S.th),ry=Math.cos(S.th);                         // camera right (horizontal)
  var ux=-Math.cos(S.ph)*Math.cos(S.th),uy=-Math.cos(S.ph)*Math.sin(S.th),uz=Math.sin(S.ph); // camera up
  S.tx+=(-dx*rx+dy*ux)*k;S.ty+=(-dx*ry+dy*uy)*k;S.tz+=dy*uz*k;
}
var pts={},lastPinch=0;
stage.addEventListener('contextmenu',function(e){e.preventDefault();});
stage.addEventListener('pointerdown',function(e){stage.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY,btn:e.button,shift:e.shiftKey};lastPinch=0;anim=null;});
stage.addEventListener('pointermove',function(e){
  var p=pts[e.pointerId];if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  var ids=Object.keys(pts);
  if(ids.length>=2){
    var a=pts[ids[0]],b=pts[ids[1]],dist=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastPinch){S.r*=lastPinch/dist;}lastPinch=dist;pan(dx/2,dy/2);
  }else if(p.btn===2||p.btn===1||p.shift){pan(dx,dy);}
  else{S.th-=dx*0.006;S.ph-=dy*0.006;}
  clearView();apply();
});
function up(e){delete pts[e.pointerId];lastPinch=0;}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',function(e){e.preventDefault();anim=null;S.r*=Math.exp(e.deltaY*0.0012);clearView();apply();},{passive:false});
stage.addEventListener('keydown',function(e){
  var k=e.key,used=true;
  if(k==='ArrowLeft')S.th-=0.08;else if(k==='ArrowRight')S.th+=0.08;
  else if(k==='ArrowUp')S.ph-=0.06;else if(k==='ArrowDown')S.ph+=0.06;
  else if(k==='+'||k==='=')S.r*=0.9;else if(k==='-')S.r*=1.1;else used=false;
  if(used){e.preventDefault();anim=null;clearView();apply();}
});

// ---- colour palette slider: recolours materials in place; the choice is remembered in this browser ----
var palEl=document.getElementById('pal'),palName=document.getElementById('pal-name'),PAL=M.palettes||[{name:'Default',mats:{}}];
function applyPalette(i){
  i=Math.max(0,Math.min(PAL.length-1,i|0));var over=PAL[i].mats||{};
  palTargets.forEach(function(tg){
    for(var k=0;k<tg.mats.length;k++){var c=over[tg.mats[k]]||M.mats[tg.mats[k]];tg.attr.setXYZ(k,c[0]/255,c[1]/255,c[2]/255);}
    tg.attr.needsUpdate=true;
  });
  palName.textContent=PAL[i].name;palEl.value=i;dirty=true;
  try{localStorage.setItem('blm-lobby-palette',String(i));}catch(e){}
}
palEl.max=PAL.length-1;
palEl.addEventListener('input',function(){applyPalette(parseInt(palEl.value,10)||0);});
(function(){var s=0;try{s=parseInt(localStorage.getItem('blm-lobby-palette'),10)||0;}catch(e){}applyPalette(s);})();

// ---- layers and floors: one refresh() derives every group's visibility from the state ----
var ceilOn=false,furnOn=true;
function press(id,on){document.getElementById(id).setAttribute('aria-pressed',on?'true':'false');}
function refresh(){
  Object.keys(groups).forEach(function(tag){
    var v=true;
    if(tag.indexOf('F2')===0)v=floor===2&&(tag!=='F2 Spa'||furnOn);
    else if(tag==='Ceiling')v=floor===2||ceilOn;
    else if(tag==='Zones')v=zonesOn&&floor===1;
    else if(tag.indexOf('Electrical ')===0)v=elOn&&floor===1&&!!elShow[tag.slice(11)];
    else if(tag==='Reception'||tag==='Lounge'||tag==='Decor'||tag==='Service')v=furnOn;
    groups[tag].visible=v;
  });
  dimGroups[1].visible=dimsOn&&floor===1;dimGroups[2].visible=dimsOn&&floor===2;
  legend.style.display=(elOn&&floor===1)?'flex':'none';
  viewBtns.forEach(function(b,i){b.style.display=VIEWS[i][3]===floor?'':'none';});
  press('f-1',floor===1);press('f-2',floor===2);
  press('t-rooms',roomsOn);press('t-zones',zonesOn);press('t-dims',dimsOn);press('t-elec',elOn);press('t-ceil',ceilOn||floor===2);press('t-furn',furnOn);
  dirty=true;
}
function setFloor(f,keepView){if(floor===f)return;floor=f;refresh();if(!keepView)go(f===1?0:10);}
document.getElementById('f-1').addEventListener('click',function(){setFloor(1);});
document.getElementById('f-2').addEventListener('click',function(){setFloor(2);});
function on(id,fn){document.getElementById(id).addEventListener('click',function(){fn();refresh();});}
// room names and zones (zone colours + zone labels) are mutually exclusive; both can be off
on('t-rooms',function(){roomsOn=!roomsOn;zonesOn=false;});
on('t-zones',function(){zonesOn=!zonesOn;roomsOn=false;});
on('t-dims',function(){dimsOn=!dimsOn;});
on('t-elec',function(){elOn=!elOn;});
on('t-ceil',function(){ceilOn=!ceilOn;});
on('t-furn',function(){furnOn=!furnOn;});
(function(){var b=document.getElementById('t-edge');b.addEventListener('click',function(){
  var v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v?'true':'false');edgeLines.forEach(function(l){l.visible=v;});dirty=true;});})();
refresh();

// ---- theme + size ----
function theme(){var c=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#dcdbd7';
  renderer.setClearColor(new THREE.Color(c),1);dirty=true;}
theme();
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',theme);}
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function size(){var w=stage.clientWidth||1,h=stage.clientHeight||1;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;}
if(window.ResizeObserver)new ResizeObserver(size).observe(stage);else window.addEventListener('resize',size);
size();go(1,true);

function frame(now){
  if(anim){
    var k=Math.min(1,(now-anim.t0)/anim.dur),e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2,f=anim.from,t=anim.to;
    ['tx','ty','tz','r','th','ph'].forEach(function(n){S[n]=f[n]+(t[n]-f[n])*e;});
    if(k>=1)anim=null;apply();
  }
  if(dirty){
    dirty=false;renderer.render(scene,camera);
    placeRooms();placeElec();placeDims();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
