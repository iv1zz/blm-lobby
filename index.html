<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLM Lobby 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen tool — slim header, full-bleed 3D stage, controls floating on the stage */
  --bg:#ecebe8; --stage:#dcdbd7; --panel:#f7f6f3; --ink:#232325; --muted:#6b6a68;
  --line:#c9c7c1; --accent:#8c6c50; --accent-ink:#ffffff; --dim:#d2372b;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1b1d; --stage:#2a2a2d; --panel:#242427; --ink:#ecebe8; --muted:#a09e99;
    --line:#3c3c40; --accent:#b08a68; --accent-ink:#1b1b1d; --dim:#ff6a5c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1b1d; --stage:#2a2a2d; --panel:#242427; --ink:#ecebe8; --muted:#a09e99;
  --line:#3c3c40; --accent:#b08a68; --accent-ink:#1b1b1d; --dim:#ff6a5c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#oldv,.dl{color:var(--accent)}
#ver{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.02em;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:500}
main{position:relative;flex:1;min-height:0;background:var(--stage)}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.bar{position:absolute;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.bar>*{pointer-events:auto}
.views{bottom:16px}
.layers{top:12px;justify-content:flex-end}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,#stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{position:absolute;left:16px;top:14px;color:var(--muted);font-size:12px;max-width:46%;pointer-events:none}
.dimlab{position:absolute;transform:translate(-50%,-50%);color:var(--dim);font-weight:600;font-size:13px;
  background:var(--panel);padding:1px 6px;border-radius:4px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.room{position:absolute;transform:translate(-50%,-50%);font:inherit;font-size:12px;font-weight:500;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;text-align:center;cursor:text}
.room:hover{border-color:var(--accent)}
.room:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.el{position:absolute;width:9px;height:9px;margin:-5px 0 0 -5px;border-radius:50%;border:1px solid rgba(0,0,0,.65);pointer-events:auto}
.el.sq{border-radius:1px}
.pal{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.pal input{width:110px;accent-color:var(--accent)}
#pal-name{min-width:9.5em;color:var(--muted)}
.legend{position:absolute;right:16px;top:52px;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:6px;font-size:12px}
.legend button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 6px;font-size:12px;text-align:left;color:var(--ink)}
.legend button[aria-pressed="false"]{background:none;color:var(--muted);text-decoration:line-through}
.legend button[aria-pressed="false"] i{opacity:.25}
.legend button[aria-pressed="true"]{background:none;color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.65);flex:none}
@media (max-width:560px){.legend{top:auto;bottom:110px;right:16px}}
#err{position:absolute;inset:auto 16px 64px 16px;background:var(--panel);border:1px solid var(--dim);color:var(--ink);
  padding:10px 12px;border-radius:6px;display:none}
@media (max-width:560px){.hint{display:none}.layers{justify-content:flex-start}}
</style>

  camera.lookAt(S.tx,S.ty,S.tz);dirty=true;
}
var VIEWS=[
  ['Overview',[14500,-7000,9500],[6200,2700,600],1],
  ['Plan',[6120,2725,15500],[6120,2735,0],1],
  ['From the parking',[6585,-5000,1600],[7000,3000,1200],1],
  ['Entrance',[6600,2400,1650],[7200,300,1100],1],
  ['Reception and guard 2',[6585,250,1600],[7000,3200,1100],1],
  ['Waiting zone',[6700,2500,1650],[8900,1100,800],1],
  ['Armchair niche',[8000,2300,1650],[5300,900,900],1],
  ['Luggage room',[9900,3300,1700],[11600,5000,900],1],
  ['CCTV post',[9950,2450,1800],[12300,500,900],1],
  ['Barrier outside',[17500,-6500,5200],[12600,-300,600],1],
  ['Spa overview',[15500,-7500,14200],[6200,2700,3300],2],
  ['Spa plan',[6120,2725,19200],[6120,2735,2850],2],
  ['Spa corridor',[11800,2700,4550],[2000,2700,4000],2],
  ['Cabins',[3100,3100,4700],[3100,600,3400],2],
  ['Showers and WC',[3700,2500,4700],[3700,4800,3500],2],
  ['Waiting zone',[9300,2600,4600],[11500,4700,3600],2]
];
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i,instant){
  if(VIEWS[i][3]!==floor){floor=VIEWS[i][3];refresh();}
  var to=fromPosTarget(VIEWS[i][1],VIEWS[i][2]);
  viewBtns.forEach(function(b,k){b.setAttribute('aria-pressed',k===i?'true':'false');});
  if(instant||reduce){S=to;apply();return;}
  var from={tx:S.tx,ty:S.ty,tz:S.tz,r:S.r,th:S.th,ph:S.ph};
  var d=to.th-from.th;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;to.th=from.th+d;
  anim={from:from,to:to,t0:performance.now(),dur:500};
}
var vb=document.getElementById('views'),viewBtns=[];
VIEWS.forEach(function(v,i){var b=document.createElement('button');b.type='button';b.textContent=v[0];b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){go(i);});vb.appendChild(b);viewBtns.push(b);});
function clearView(){viewBtns.forEach(function(b){b.setAttribute('aria-pressed','false');});}

function pan(dx,dy){
  var k=S.r*0.0016;
  var rx=-Math.sin(S.th),ry=Math.cos(S.th);                         // camera right (horizontal)
  var ux=-Math.cos(S.ph)*Math.cos(S.th),uy=-Math.cos(S.ph)*Math.sin(S.th),uz=Math.sin(S.ph); // camera up
  S.tx+=(-dx*rx+dy*ux)*k;S.ty+=(-dx*ry+dy*uy)*k;S.tz+=dy*uz*k;
}
var pts={},lastPinch=0;
stage.addEventListener('contextmenu',function(e){e.preventDefault();});
stage.addEventListener('pointerdown',function(e){stage.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY,btn:e.button,shift:e.shiftKey};lastPinch=0;anim=null;});
stage.addEventListener('pointermove',function(e){
  var p=pts[e.pointerId];if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  var ids=Object.keys(pts);
  if(ids.length>=2){
    var a=pts[ids[0]],b=pts[ids[1]],dist=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastPinch){S.r*=lastPinch/dist;}lastPinch=dist;pan(dx/2,dy/2);
  }else if(p.btn===2||p.btn===1||p.shift){pan(dx,dy);}
  else{S.th-=dx*0.006;S.ph-=dy*0.006;}
  clearView();apply();
});
function up(e){delete pts[e.pointerId];lastPinch=0;}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',function(e){e.preventDefault();anim=null;S.r*=Math.exp(e.deltaY*0.0012);clearView();apply();},{passive:false});
stage.addEventListener('keydown',function(e){
  var k=e.key,used=true;
  if(k==='ArrowLeft')S.th-=0.08;else if(k==='ArrowRight')S.th+=0.08;
  else if(k==='ArrowUp')S.ph-=0.06;else if(k==='ArrowDown')S.ph+=0.06;
  else if(k==='+'||k==='=')S.r*=0.9;else if(k==='-')S.r*=1.1;else used=false;
  if(used){e.preventDefault();anim=null;clearView();apply();}
});

// ---- colour palette slider: recolours materials in place; the choice is remembered in this browser ----
var palEl=document.getElementById('pal'),palName=document.getElementById('pal-name'),PAL=M.palettes||[{name:'Default',mats:{}}];
function applyPalette(i){
  i=Math.max(0,Math.min(PAL.length-1,i|0));var over=PAL[i].mats||{};
  palTargets.forEach(function(tg){
    for(var k=0;k<tg.mats.length;k++){var c=over[tg.mats[k]]||M.mats[tg.mats[k]];tg.attr.setXYZ(k,c[0]/255,c[1]/255,c[2]/255);}
    tg.attr.needsUpdate=true;
  });
  palName.textContent=PAL[i].name;palEl.value=i;dirty=true;
  try{localStorage.setItem('blm-lobby-palette',String(i));}catch(e){}
}
palEl.max=PAL.length-1;
palEl.addEventListener('input',function(){applyPalette(parseInt(palEl.value,10)||0);});
(function(){var s=0;try{s=parseInt(localStorage.getItem('blm-lobby-palette'),10)||0;}catch(e){}applyPalette(s);})();

// ---- layers and floors: one refresh() derives every group's visibility from the state ----
var ceilOn=false,furnOn=true;
function press(id,on){document.getElementById(id).setAttribute('aria-pressed',on?'true':'false');}
function refresh(){
  Object.keys(groups).forEach(function(tag){
    var v=true;
    if(tag.indexOf('F2')===0)v=floor===2&&(tag!=='F2 Spa'||furnOn);
    else if(tag==='Ceiling')v=floor===2||ceilOn;
    else if(tag==='Zones')v=zonesOn&&floor===1;
    else if(tag.indexOf('Electrical ')===0)v=elOn&&floor===1&&!!elShow[tag.slice(11)];
    else if(tag==='Reception'||tag==='Lounge'||tag==='Decor'||tag==='Service')v=furnOn;
    groups[tag].visible=v;
  });
  dimGroups[1].visible=dimsOn&&floor===1;dimGroups[2].visible=dimsOn&&floor===2;
  legend.style.display=(elOn&&floor===1)?'flex':'none';
  viewBtns.forEach(function(b,i){b.style.display=VIEWS[i][3]===floor?'':'none';});
  press('f-1',floor===1);press('f-2',floor===2);
  press('t-rooms',roomsOn);press('t-zones',zonesOn);press('t-stock',stockOn);press('t-dims',dimsOn);press('t-elec',elOn);press('t-ceil',ceilOn||floor===2);press('t-furn',furnOn);
  dirty=true;
}
function setFloor(f,keepView){if(floor===f)return;floor=f;refresh();if(!keepView)go(f===1?0:10);}
document.getElementById('f-1').addEventListener('click',function(){setFloor(1);});
document.getElementById('f-2').addEventListener('click',function(){setFloor(2);});
function on(id,fn){document.getElementById(id).addEventListener('click',function(){fn();refresh();});}
// room names and zones (zone colours + zone labels) are mutually exclusive; both can be off
on('t-rooms',function(){roomsOn=!roomsOn;zonesOn=false;stockOn=false;});
on('t-zones',function(){zonesOn=!zonesOn;roomsOn=false;stockOn=false;});
on('t-stock',function(){stockOn=!stockOn;roomsOn=false;zonesOn=false;});
on('t-dims',function(){dimsOn=!dimsOn;});
on('t-elec',function(){elOn=!elOn;});
on('t-ceil',function(){ceilOn=!ceilOn;});
on('t-furn',function(){furnOn=!furnOn;});
(function(){var b=document.getElementById('t-edge');b.addEventListener('click',function(){
  var v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v?'true':'false');edgeLines.forEach(function(l){l.visible=v;});dirty=true;});})();
refresh();

// ---- theme + size ----
function theme(){var c=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#dcdbd7';
  renderer.setClearColor(new THREE.Color(c),1);dirty=true;}
theme();
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',theme);}
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function size(){var w=stage.clientWidth||1,h=stage.clientHeight||1;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;}
if(window.ResizeObserver)new ResizeObserver(size).observe(stage);else window.addEventListener('resize',size);
size();go(1,true);

function frame(now){
  if(anim){
    var k=Math.min(1,(now-anim.t0)/anim.dur),e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2,f=anim.from,t=anim.to;
    ['tx','ty','tz','r','th','ph'].forEach(function(n){S[n]=f[n]+(t[n]-f[n])*e;});
    if(k>=1)anim=null;apply();
  }
  if(dirty){
    dirty=false;renderer.render(scene,camera);
    placeRooms();placeElec();placeDims();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
